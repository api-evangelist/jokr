name: jokr
description: JOKR is an instant grocery and convenience delivery company headquartered in Luxembourg (JOKR
  S.a.r.L) that operates an online supermarket delivering fresh products and local brands to consumers within
  minutes or on a scheduled window through its mobile app. The service offers more than 10,000 products with
  AI-powered personalized recommendations and competitive supermarket pricing, and reports roughly 3 million
  app downloads and 5 million users. In Brazil it operates under the DAKI brand (soudaki.com), the leading
  online supermarket in cities including Sao Paulo and Belo Horizonte. JOKR is a consumer-facing quick-commerce
  business with no public developer API surface; this profile captures its identity and domain posture in the
  API Evangelist network. Backed by Balderton Capital, GGV Capital, and HV Capital.
